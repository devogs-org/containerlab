# Logs are an event stream, not files (twelve-factor): the firewalls forward their syslog to the collector
# (OpenObserve) and keep nothing. The journal lives in RAM, is small, and a log flood is rate limited.
# Why: during a DHCP storm Kea logged every packet and the persistent journal grew to 3.9 GB.
# Mounted as /etc/systemd/journald.conf.d/10-stream-only.conf (read by journald at boot, before any log is written).
[Journal]
Storage=volatile
RuntimeMaxUse=32M
RateLimitIntervalSec=30s
RateLimitBurst=500
