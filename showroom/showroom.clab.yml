name: showroom

mgmt:
  network: clab-mgmt
  ipv4-subnet: 10.16.10.0/24

topology:
  # CPU layout of the 16-CPU host: 0-5 shared by the 7 Tarvos nodes (cpu cap of their group), 6-11 shared by the
  # VyOS, IOL and client containers (the cpu caps of their groups), 12-15 left to the other services of the host
  # (NetBox, LibreNMS, OpenObserve, Semaphore).
  groups:
    vyatta:
      kind: vyosnetworks_vyos
      image: matt13290/vyos:2026.03-generic-amd64
      binds:
        # Privileged containers share the host kernel ring buffer: hide /dev/kmsg
        # so journald/rsyslog don't forward host kernel logs (UFW, AppArmor...)
        - /dev/null:/dev/kmsg
        # Boot hook enforcing syslog settings (config.boot is per-node, so no shared startup-config)
        - configs/vyos-postconfig-bootup.script:/config/scripts/vyos-postconfig-bootup.script:ro
        # Logs are streamed to the collector, not kept: volatile, small and rate limited journal (see the file)
        - configs/vyos-journald.conf:/etc/systemd/journald.conf.d/10-stream-only.conf:ro
      # CPU budget of the network nodes: a DHCP/broadcast storm took each firewall to ~250% CPU (Kea, journald,
      # rsyslog) and the whole host to ~80%. 1.5 CPU is plenty at idle (~0.3%).
      cpu: 1.5
      cpu-set: "6-11"
      # Memory cap (host protection only): ~450-700 MiB used, so 2gb is ~3x headroom.
      memory: 2gb
    tarvos:
      kind: linux
      image: matt13290/tarvos:v2.1.4
      # Tarvos (FRR + Sysrepo/Netopeer2 + eBPF telemetry): no kind of its own, so the linux kind with the capabilities and sysctls
      # of its docker-compose.yml (https://github.com/devogs/tarvos). The links are attached after boot (eth1+), eth0 is the mgmt VRF.
      cap-add:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN
        - BPF
        - PERFMON
        - CHOWN
        - SETUID
        - SETGID
        - DAC_OVERRIDE
        - FOWNER
        - KILL
        - SYS_CHROOT
        - AUDIT_WRITE
        - NET_BIND_SERVICE
      sysctls:
        net.ipv4.ip_forward: "1"
        # sshd/netopeer2 are not VRF-aware: accept connections coming from the mgmt VRF
        net.ipv4.tcp_l3mdev_accept: "1"
        net.ipv4.udp_l3mdev_accept: "1"
      env:
        # AAA: tac_plus-ng of showroom-identity (fixed IP on clab-mgmt). The shared key is TACACS_KEY of that repository's .env,
        # exported in the shell before `containerlab deploy`. admin / ADMIN_PASSWORD stays the local break-glass account.
        TACACS_SERVER: "10.16.10.140"
        TACACS_SECRET: "${TACACS_KEY}"
        TACACS_TIMEOUT: "5"
        TACACS_NETCONF_ACCESS: "rw"
        ADMIN_PASSWORD: "${TARVOS_ADMIN_PASSWORD:-admin}"
        # Syslog to the collector (Telegraf, same as the other nodes)
        SYSLOG_SERVER: "10.16.10.100"
        SYSLOG_PORT: "514"
        SYSLOG_PROTOCOL: "udp"
        # gNMI server (57400, mgmt VRF) polled by Telegraf (10.16.10.100); Prometheus /metrics on 9273
        GNMI_ENABLED: "yes"
        GNMI_PORT: "57400"
        PROMETHEUS_ENABLED: "yes"
        TELEMETRY_ENABLED: "yes"
        FRR_DAEMONS: "bgpd"
        LLDP_ENABLED: "yes"
        LLDP_INTERFACES: "eth*,!eth0"
      # One CPU each: ~115 MiB of RAM per node, so a 1gb cap (host protection only) is ~8x headroom.
      cpu: 1
      cpu-set: "0-5"
      memory: 1gb
    cisco:
      kind: cisco_iol
      image: matt13290/cisco_iol:17.15.01
      binds:
        # Persistent per-node "flash": the IOL unix: filesystem is /iol, so this shows up as
        # unix:/flash/. Used for native snapshots (copy running-config unix:/flash/<name>.cfg)
        # and rollback (configure replace unix:/flash/<name>.cfg force).
        # Kept outside clab-showroom/ so --reconfigure does not wipe it. Containerlab requires the
        # folders to exist: mkdir -p showroom/flash/<node> (see README).
        - flash/__clabNodeName__:/iol/flash
        # Patched vrnetlab entrypoint: waits for the CLAB_INTFS data links before starting iouyap/IOL. The stock one
        # starts after a fixed "sleep 5", so on this topology iouyap dies (ioctl: No such device) and IOL boots with -e 1.
        - iol-entrypoint.sh:/entrypoint.sh:ro
      # IOL is mostly single-threaded and idles at ~1% CPU. The cap keeps a storm from taking the host
      # (the L2 images cannot police or storm-control, so the container is the only limit).
      cpu: 0.5
      cpu-set: "6-11"
      # Memory cap (host protection only): ~165-185 MiB used, so 768mb is ~4x headroom.
      memory: 768mb
    clients:
      kind: linux
      image: alpine:latest
      network-mode: none
      cpu: 0.25
      cpu-set: "6-11"
      # Memory cap (host protection only): ~1-6 MiB used.
      memory: 64mb
      binds:
        - configs/udhcpc-dns.script:/usr/local/bin/udhcpc-dns.script:ro
      exec:
        # The lease (Kea on the firewalls) carries the DNS servers and the domain: the script writes them in /etc/resolv.conf.
        - udhcpc -i eth1 -b -q -s /usr/local/bin/udhcpc-dns.script
    # Data-center servers: same limits, but a static address (set per node, from NetBox) instead of DHCP.
    servers:
      kind: linux
      image: alpine:latest
      network-mode: none
      cpu: 0.25
      cpu-set: "6-11"
      memory: 64mb
    # iperf3 servers of the data center (image built from showroom/images/iperf3): same as the servers, but the entrypoint of the
    # image (iperf3) starts the server through cmd. 5201/tcp is the pool of the HAProxy service of the firewalls.
    iperf-servers:
      kind: linux
      image: showroom/iperf3:latest
      image-pull-policy: never
      network-mode: none
      cmd: -s
      cpu: 0.25
      cpu-set: "6-11"
      memory: 128mb

  nodes:
    # ---------------- VyOS firewalls (10.16.10.11-19) ----------------
    FW1:
      group: vyatta
      mgmt-ipv4: 10.16.10.11
    FW2:
      group: vyatta
      mgmt-ipv4: 10.16.10.12

    # Host bridge, created by netplan (clab only attaches to it)
    br-wan:
      kind: bridge

    # ---------------- Tarvos (10.16.10.21-29) ----------------
    BorderLeaf-1:
      group: tarvos
      mgmt-ipv4: 10.16.10.21
    BorderLeaf-2:
      group: tarvos
      mgmt-ipv4: 10.16.10.22
    Spine-1:
      group: tarvos
      mgmt-ipv4: 10.16.10.23
    Spine-2:
      group: tarvos
      mgmt-ipv4: 10.16.10.24
    Leaf-1:
      group: tarvos
      mgmt-ipv4: 10.16.10.25
    Leaf-2:
      group: tarvos
      mgmt-ipv4: 10.16.10.26
    Leaf-3:
      group: tarvos
      mgmt-ipv4: 10.16.10.27

    # ---------------- Cisco IOL (10.16.10.31-49) ----------------
    core1:
      group: cisco
      mgmt-ipv4: 10.16.10.31
    core2:
      group: cisco
      mgmt-ipv4: 10.16.10.32

    dist1-1:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.33
    dist1-2:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.34
    dist2-1:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.35
    dist2-2:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.36

    access1-1:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.37
    access1-2:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.38
    access2-1:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.39
    access2-2:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.40

    # Dataplane testing clients (Alpine Linux): no mgmt interface, eth1 via DHCP
    client1:
      group: clients
    client2:
      group: clients
    client3:
      group: clients
    client4:
      group: clients

    # Data-center servers (Alpine Linux): no mgmt interface, static eth1 in the VLAN subnet (NetBox VM server5-8, now server1-4, VRF PROD). The DNS servers
    # are the DNS forwarders of the firewalls (their lo addresses, FW1 first: the data center reaches FW2's address only through FW1).
    # The default route is the anycast gateway of the VLAN; the ping primes the MAC/ARP learning of the leaf.
    server1:   # Leaf-1 eth10, DC-APP-A (VLAN 10)
      group: servers
      exec:
        - ip addr add 172.24.10.11/24 dev eth1
        - ip route add default via 172.24.10.1
        - sh -c "printf 'search devogs.xyz\\nnameserver 172.16.8.1\\nnameserver 172.16.8.2\\n' > /etc/resolv.conf"
        - ping -c 1 -W 2 172.24.10.1
    server2:   # Leaf-1 eth11, DC-DB-STRETCH (VLAN 30)
      group: servers
      exec:
        - ip addr add 172.24.30.11/24 dev eth1
        - ip route add default via 172.24.30.1
        - sh -c "printf 'search devogs.xyz\\nnameserver 172.16.8.1\\nnameserver 172.16.8.2\\n' > /etc/resolv.conf"
        - ping -c 1 -W 2 172.24.30.1
    server3:   # Leaf-2 eth10, DC-APP-B (VLAN 20)
      group: servers
      exec:
        - ip addr add 172.24.20.11/24 dev eth1
        - ip route add default via 172.24.20.1
        - sh -c "printf 'search devogs.xyz\\nnameserver 172.16.8.1\\nnameserver 172.16.8.2\\n' > /etc/resolv.conf"
        - ping -c 1 -W 2 172.24.20.1
    server4:   # Leaf-2 eth11, DC-DB-STRETCH (VLAN 30)
      group: servers
      exec:
        - ip addr add 172.24.30.12/24 dev eth1
        - ip route add default via 172.24.30.1
        - sh -c "printf 'search devogs.xyz\\nnameserver 172.16.8.1\\nnameserver 172.16.8.2\\n' > /etc/resolv.conf"
        - ping -c 1 -W 2 172.24.30.1
    server5:   # Leaf-3 eth10, DC-APP-A (VLAN 10), iperf3 server
      group: iperf-servers
      exec:
        - ip addr add 172.24.10.12/24 dev eth1
        - ip route add default via 172.24.10.1
        - ping -c 1 -W 2 172.24.10.1
    server6:   # Leaf-3 eth11, DC-APP-B (VLAN 20), iperf3 server
      group: iperf-servers
      exec:
        - ip addr add 172.24.20.12/24 dev eth1
        - ip route add default via 172.24.20.1
        - ping -c 1 -W 2 172.24.20.1

  links:
    # --- External WAN ---
    - endpoints: ["FW1:eth1", "br-wan:wan-fw1"]
    - endpoints: ["FW2:eth1", "br-wan:wan-fw2"]

    # --- FW1 interconnects ---
    - endpoints: ["FW1:eth2", "core1:Ethernet0/1"]
    - endpoints: ["FW1:eth3", "core2:Ethernet0/1"]
    - endpoints: ["FW1:eth4", "BorderLeaf-1:eth10"]
    - endpoints: ["FW1:eth5", "BorderLeaf-2:eth10"]

    # --- FW2 interconnects ---
    - endpoints: ["FW2:eth2", "core1:Ethernet0/2"]
    - endpoints: ["FW2:eth3", "core2:Ethernet0/2"]
    - endpoints: ["FW2:eth4", "BorderLeaf-1:eth20"]
    - endpoints: ["FW2:eth5", "BorderLeaf-2:eth20"]

    # --- FW HA interconnect ---
    - endpoints: ["FW1:eth6", "FW2:eth6"]

    # --- Tarvos: border leaf to spine ---
    - endpoints: ["BorderLeaf-1:eth1", "Spine-1:eth1"]
    - endpoints: ["BorderLeaf-1:eth2", "Spine-2:eth1"]
    - endpoints: ["BorderLeaf-2:eth1", "Spine-1:eth2"]
    - endpoints: ["BorderLeaf-2:eth2", "Spine-2:eth2"]

    # --- Tarvos: spine to leaf ---
    - endpoints: ["Spine-1:eth3", "Leaf-1:eth1"]
    - endpoints: ["Spine-1:eth4", "Leaf-2:eth1"]
    - endpoints: ["Spine-2:eth3", "Leaf-1:eth2"]
    - endpoints: ["Spine-2:eth4", "Leaf-2:eth2"]
    - endpoints: ["Spine-1:eth5", "Leaf-3:eth1"]
    - endpoints: ["Spine-2:eth5", "Leaf-3:eth2"]

    # --- Cisco: core to distribution (shifted to free Ethernet0/1-0/2 for FW uplinks) ---
    - endpoints: ["core1:Ethernet0/3", "dist1-1:Ethernet0/1"]
    - endpoints: ["core1:Ethernet1/0", "dist1-2:Ethernet0/1"]
    - endpoints: ["core2:Ethernet0/3", "dist1-1:Ethernet0/2"]
    - endpoints: ["core2:Ethernet1/0", "dist1-2:Ethernet0/2"]
    - endpoints: ["core1:Ethernet1/1", "dist2-1:Ethernet0/1"]
    - endpoints: ["core1:Ethernet1/2", "dist2-2:Ethernet0/1"]
    - endpoints: ["core2:Ethernet1/1", "dist2-1:Ethernet0/2"]
    - endpoints: ["core2:Ethernet1/2", "dist2-2:Ethernet0/2"]

    # --- Cisco: distribution LACP interconnects ---
    - endpoints: ["dist1-1:Ethernet1/2", "dist1-2:Ethernet1/2"]
    - endpoints: ["dist1-1:Ethernet1/3", "dist1-2:Ethernet1/3"]
    - endpoints: ["dist2-1:Ethernet1/2", "dist2-2:Ethernet1/2"]
    - endpoints: ["dist2-1:Ethernet1/3", "dist2-2:Ethernet1/3"]

    # --- Cisco: distribution to access ---
    - endpoints: ["dist1-1:Ethernet1/0", "access1-1:Ethernet0/1"]
    - endpoints: ["dist1-2:Ethernet1/0", "access1-1:Ethernet0/2"]
    - endpoints: ["dist1-1:Ethernet1/1", "access1-2:Ethernet0/1"]
    - endpoints: ["dist1-2:Ethernet1/1", "access1-2:Ethernet0/2"]
    - endpoints: ["dist2-1:Ethernet1/0", "access2-1:Ethernet0/1"]
    - endpoints: ["dist2-2:Ethernet1/0", "access2-1:Ethernet0/2"]
    - endpoints: ["dist2-1:Ethernet1/1", "access2-2:Ethernet0/1"]
    - endpoints: ["dist2-2:Ethernet1/1", "access2-2:Ethernet0/2"]

    # --- Cisco: access to clients ---
    - endpoints: ["access1-1:Ethernet0/3", "client1:eth1"]
    - endpoints: ["access1-2:Ethernet0/3", "client2:eth1"]
    - endpoints: ["access2-1:Ethernet0/3", "client3:eth1"]
    - endpoints: ["access2-2:Ethernet0/3", "client4:eth1"]

    # --- Tarvos: leaf access ports to the data-center servers ---
    - endpoints: ["Leaf-1:eth10", "server1:eth1"]
    - endpoints: ["Leaf-1:eth11", "server2:eth1"]
    - endpoints: ["Leaf-2:eth10", "server3:eth1"]
    - endpoints: ["Leaf-2:eth11", "server4:eth1"]
    - endpoints: ["Leaf-3:eth10", "server5:eth1"]
    - endpoints: ["Leaf-3:eth11", "server6:eth1"]
