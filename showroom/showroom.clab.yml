name: showroom

mgmt:
  network: clab-mgmt
  ipv4-subnet: 10.16.10.0/24

topology:
  # CPU layout of the 16-CPU host: 0-5 one core per SR Linux node (cpu-set per node below), 6-11 shared by the
  # VyOS, IOL and host containers (the cpu caps of their groups), 12-15 left to the other services of the host
  # (NetBox, LibreNMS, OpenObserve, Semaphore).
  groups:
    vyatta:
      kind: vyosnetworks_vyos
      image: matt13290/vyos:2026.03-generic-amd64
      binds:
        # Privileged containers share the host kernel ring buffer: hide /dev/kmsg
        # so journald/rsyslog don't forward host kernel logs (UFW, AppArmor...)
        - /dev/null:/dev/kmsg
        # Boot hook enforcing syslog settings (config.boot is per-node, so no shared startup-config)
        - configs/vyos-postconfig-bootup.script:/config/scripts/vyos-postconfig-bootup.script:ro
        # Logs are streamed to the collector, not kept: volatile, small and rate limited journal (see the file)
        - configs/vyos-journald.conf:/etc/systemd/journald.conf.d/10-stream-only.conf:ro
      # CPU budget of the network nodes: a DHCP/broadcast storm took each firewall to ~250% CPU (Kea, journald,
      # rsyslog) and the whole host to ~80%. 1.5 CPU is plenty at idle (~0.3%).
      cpu: 1.5
      cpu-set: "6-11"
      # Memory cap (host protection only): ~450-700 MiB used, so 2gb is ~3x headroom.
      memory: 2gb
    nokia:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      type: ixr-d1
      startup-config: configs/srl.partial.cli
      cpu: 1
      # Memory cap (host protection only): ~1.7 GiB used per node (peak 1.8), so 4gb is >2x headroom.
      memory: 4gb
    cisco:
      kind: cisco_iol
      image: matt13290/cisco_iol:17.15.01
      binds:
        # Persistent per-node "flash": the IOL unix: filesystem is /iol, so this shows up as
        # unix:/flash/. Used for native snapshots (copy running-config unix:/flash/<name>.cfg)
        # and rollback (configure replace unix:/flash/<name>.cfg force).
        # Kept outside clab-showroom/ so --reconfigure does not wipe it. Containerlab requires the
        # folders to exist: mkdir -p showroom/flash/<node> (see README).
        - flash/__clabNodeName__:/iol/flash
      # IOL is mostly single-threaded and idles at ~1% CPU. The cap keeps a storm from taking the host
      # (the L2 images cannot police or storm-control, so the container is the only limit).
      cpu: 0.5
      cpu-set: "6-11"
      # Memory cap (host protection only): ~165-185 MiB used, so 768mb is ~4x headroom.
      memory: 768mb
    hosts:
      kind: linux
      image: alpine:latest
      network-mode: none
      cpu: 0.25
      cpu-set: "6-11"
      # Memory cap (host protection only): ~1-6 MiB used.
      memory: 64mb
      binds:
        - configs/udhcpc-dns.script:/usr/local/bin/udhcpc-dns.script:ro
      exec:
        # The lease (Kea on the firewalls) carries the DNS servers and the domain: the script writes them in /etc/resolv.conf.
        - udhcpc -i eth1 -b -q -s /usr/local/bin/udhcpc-dns.script
    # Data-center servers: same limits, but a static address (set per node, from NetBox) instead of DHCP.
    servers:
      kind: linux
      image: alpine:latest
      network-mode: none
      cpu: 0.25
      cpu-set: "6-11"
      memory: 64mb

  nodes:
    # ---------------- VyOS firewalls (10.16.10.11-19) ----------------
    FW1:
      group: vyatta
      mgmt-ipv4: 10.16.10.11
    FW2:
      group: vyatta
      mgmt-ipv4: 10.16.10.12

    # Host bridge, created by netplan (clab only attaches to it)
    br-wan:
      kind: bridge

    # ---------------- SR Linux (10.16.10.21-29) ----------------
    BorderLeaf-1:
      group: nokia
      # IXR-D2L: the IXR-D1 chassis has no VXLAN/EVPN data model (no tunnel-interface, bgp-evpn, bgp-vpn).
      type: ixr-d2l
      cpu-set: "0"
      mgmt-ipv4: 10.16.10.21
    BorderLeaf-2:
      group: nokia
      # IXR-D2L: the IXR-D1 chassis has no VXLAN/EVPN data model (no tunnel-interface, bgp-evpn, bgp-vpn).
      type: ixr-d2l
      cpu-set: "1"
      mgmt-ipv4: 10.16.10.22
    Spine-1:
      group: nokia
      cpu-set: "2"
      mgmt-ipv4: 10.16.10.23
    Spine-2:
      group: nokia
      cpu-set: "3"
      mgmt-ipv4: 10.16.10.24
    Leaf-1:
      group: nokia
      # IXR-D2L: the IXR-D1 chassis has no VXLAN/EVPN data model (no tunnel-interface, bgp-evpn, bgp-vpn).
      type: ixr-d2l
      cpu-set: "4"
      mgmt-ipv4: 10.16.10.25
    Leaf-2:
      group: nokia
      # IXR-D2L: the IXR-D1 chassis has no VXLAN/EVPN data model (no tunnel-interface, bgp-evpn, bgp-vpn).
      type: ixr-d2l
      cpu-set: "5"
      mgmt-ipv4: 10.16.10.26

    # ---------------- Cisco IOL (10.16.10.31-49) ----------------
    core1:
      group: cisco
      mgmt-ipv4: 10.16.10.31
    core2:
      group: cisco
      mgmt-ipv4: 10.16.10.32

    dist1-1:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.33
    dist1-2:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.34
    dist2-1:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.35
    dist2-2:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.36

    access1-1:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.37
    access1-2:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.38
    access2-1:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.39
    access2-2:
      group: cisco
      image: matt13290/cisco_iol:l2-17.15.01
      type: l2
      mgmt-ipv4: 10.16.10.40

    # Dataplane testing hosts (Alpine Linux): no mgmt interface, eth1 via DHCP
    host1:
      group: hosts
    host2:
      group: hosts
    host3:
      group: hosts
    host4:
      group: hosts

    # Data-center servers (Alpine Linux): no mgmt interface, static eth1 in the VLAN subnet (NetBox VM server5-8, VRF PROD). The DNS servers
    # are the DNS forwarders of the firewalls (their lo addresses, FW1 first: the data center reaches FW2's address only through FW1).
    # The default route is the anycast gateway of the VLAN; the ping primes the MAC/ARP learning of the leaf.
    server5:   # Leaf-1 ethernet-1/10, DC-APP-A (VLAN 10)
      group: servers
      exec:
        - ip addr add 172.24.10.11/24 dev eth1
        - ip route add default via 172.24.10.1
        - sh -c "printf 'search devogs.xyz\\nnameserver 172.16.8.1\\nnameserver 172.16.8.2\\n' > /etc/resolv.conf"
        - ping -c 1 -W 2 172.24.10.1
    server6:   # Leaf-1 ethernet-1/11, DC-DB-STRETCH (VLAN 30)
      group: servers
      exec:
        - ip addr add 172.24.30.11/24 dev eth1
        - ip route add default via 172.24.30.1
        - sh -c "printf 'search devogs.xyz\\nnameserver 172.16.8.1\\nnameserver 172.16.8.2\\n' > /etc/resolv.conf"
        - ping -c 1 -W 2 172.24.30.1
    server7:   # Leaf-2 ethernet-1/10, DC-APP-B (VLAN 20)
      group: servers
      exec:
        - ip addr add 172.24.20.11/24 dev eth1
        - ip route add default via 172.24.20.1
        - sh -c "printf 'search devogs.xyz\\nnameserver 172.16.8.1\\nnameserver 172.16.8.2\\n' > /etc/resolv.conf"
        - ping -c 1 -W 2 172.24.20.1
    server8:   # Leaf-2 ethernet-1/11, DC-DB-STRETCH (VLAN 30)
      group: servers
      exec:
        - ip addr add 172.24.30.12/24 dev eth1
        - ip route add default via 172.24.30.1
        - sh -c "printf 'search devogs.xyz\\nnameserver 172.16.8.1\\nnameserver 172.16.8.2\\n' > /etc/resolv.conf"
        - ping -c 1 -W 2 172.24.30.1

  links:
    # --- External WAN ---
    - endpoints: ["FW1:eth1", "br-wan:wan-fw1"]
    - endpoints: ["FW2:eth1", "br-wan:wan-fw2"]

    # --- FW1 interconnects ---
    - endpoints: ["FW1:eth2", "core1:Ethernet0/1"]
    - endpoints: ["FW1:eth3", "core2:Ethernet0/1"]
    - endpoints: ["FW1:eth4", "BorderLeaf-1:ethernet-1/10"]
    - endpoints: ["FW1:eth5", "BorderLeaf-2:ethernet-1/10"]

    # --- FW2 interconnects ---
    - endpoints: ["FW2:eth2", "core1:Ethernet0/2"]
    - endpoints: ["FW2:eth3", "core2:Ethernet0/2"]
    - endpoints: ["FW2:eth4", "BorderLeaf-1:ethernet-1/20"]
    - endpoints: ["FW2:eth5", "BorderLeaf-2:ethernet-1/20"]

    # --- FW HA interconnect ---
    - endpoints: ["FW1:eth6", "FW2:eth6"]

    # --- SR Linux: border leaf to spine ---
    - endpoints: ["BorderLeaf-1:ethernet-1/1", "Spine-1:ethernet-1/1"]
    - endpoints: ["BorderLeaf-1:ethernet-1/2", "Spine-2:ethernet-1/1"]
    - endpoints: ["BorderLeaf-2:ethernet-1/1", "Spine-1:ethernet-1/2"]
    - endpoints: ["BorderLeaf-2:ethernet-1/2", "Spine-2:ethernet-1/2"]

    # --- SR Linux: spine to leaf ---
    - endpoints: ["Spine-1:ethernet-1/3", "Leaf-1:ethernet-1/1"]
    - endpoints: ["Spine-1:ethernet-1/4", "Leaf-2:ethernet-1/1"]
    - endpoints: ["Spine-2:ethernet-1/3", "Leaf-1:ethernet-1/2"]
    - endpoints: ["Spine-2:ethernet-1/4", "Leaf-2:ethernet-1/2"]

    # --- Cisco: core to distribution (shifted to free Ethernet0/1-0/2 for FW uplinks) ---
    - endpoints: ["core1:Ethernet0/3", "dist1-1:Ethernet0/1"]
    - endpoints: ["core1:Ethernet1/0", "dist1-2:Ethernet0/1"]
    - endpoints: ["core2:Ethernet0/3", "dist1-1:Ethernet0/2"]
    - endpoints: ["core2:Ethernet1/0", "dist1-2:Ethernet0/2"]
    - endpoints: ["core1:Ethernet1/1", "dist2-1:Ethernet0/1"]
    - endpoints: ["core1:Ethernet1/2", "dist2-2:Ethernet0/1"]
    - endpoints: ["core2:Ethernet1/1", "dist2-1:Ethernet0/2"]
    - endpoints: ["core2:Ethernet1/2", "dist2-2:Ethernet0/2"]

    # --- Cisco: distribution LACP interconnects ---
    - endpoints: ["dist1-1:Ethernet1/2", "dist1-2:Ethernet1/2"]
    - endpoints: ["dist1-1:Ethernet1/3", "dist1-2:Ethernet1/3"]
    - endpoints: ["dist2-1:Ethernet1/2", "dist2-2:Ethernet1/2"]
    - endpoints: ["dist2-1:Ethernet1/3", "dist2-2:Ethernet1/3"]

    # --- Cisco: distribution to access ---
    - endpoints: ["dist1-1:Ethernet1/0", "access1-1:Ethernet0/1"]
    - endpoints: ["dist1-2:Ethernet1/0", "access1-1:Ethernet0/2"]
    - endpoints: ["dist1-1:Ethernet1/1", "access1-2:Ethernet0/1"]
    - endpoints: ["dist1-2:Ethernet1/1", "access1-2:Ethernet0/2"]
    - endpoints: ["dist2-1:Ethernet1/0", "access2-1:Ethernet0/1"]
    - endpoints: ["dist2-2:Ethernet1/0", "access2-1:Ethernet0/2"]
    - endpoints: ["dist2-1:Ethernet1/1", "access2-2:Ethernet0/1"]
    - endpoints: ["dist2-2:Ethernet1/1", "access2-2:Ethernet0/2"]

    # --- Cisco: access to hosts ---
    - endpoints: ["access1-1:Ethernet0/3", "host1:eth1"]
    - endpoints: ["access1-2:Ethernet0/3", "host2:eth1"]
    - endpoints: ["access2-1:Ethernet0/3", "host3:eth1"]
    - endpoints: ["access2-2:Ethernet0/3", "host4:eth1"]

    # --- SR Linux: leaf access ports to the data-center servers ---
    - endpoints: ["Leaf-1:ethernet-1/10", "server5:eth1"]
    - endpoints: ["Leaf-1:ethernet-1/11", "server6:eth1"]
    - endpoints: ["Leaf-2:ethernet-1/10", "server7:eth1"]
    - endpoints: ["Leaf-2:ethernet-1/11", "server8:eth1"]
