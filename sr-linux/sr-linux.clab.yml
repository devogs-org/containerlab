name: sr-linux

mgmt:
  network: sr-linux-mgmt
  ipv4-subnet: 10.16.2.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:latest
      type: ixr-d1
      cpu: 1

  nodes:
    # 2 Border Leaf Switches (Uplinks to VyOS HA)
    BorderLeaf-1:
      kind: nokia_srlinux
      cpu-set: "0"
      mgmt-ipv4: 10.16.2.31

    BorderLeaf-2:
      kind: nokia_srlinux
      cpu-set: "1"
      mgmt-ipv4: 10.16.2.32

    # 2 Spine Switches
    Spine-1:
      kind: nokia_srlinux
      cpu-set: "2"
      mgmt-ipv4: 10.16.2.11

    Spine-2:
      kind: nokia_srlinux
      cpu-set: "3"
      mgmt-ipv4: 10.16.2.12

    # 2 Leaf Switches
    Leaf-1:
      kind: nokia_srlinux
      cpu-set: "4"
      mgmt-ipv4: 10.16.2.21

    Leaf-2:
      kind: nokia_srlinux
      cpu-set: "5"
      mgmt-ipv4: 10.16.2.22

  links:
    # Border Leaf Uplinks to VyOS HA via Transit Bridge
    - endpoints: ["BorderLeaf-1:ethernet-1/10", "host:br-srlinux-wan:eth1"]
    - endpoints: ["BorderLeaf-2:ethernet-1/10", "host:br-srlinux-wan:eth2"]

    # Border Leaf to Spine Mesh
    - endpoints: ["BorderLeaf-1:ethernet-1/1", "Spine-1:ethernet-1/1"]
    - endpoints: ["BorderLeaf-1:ethernet-1/2", "Spine-2:ethernet-1/1"]
    - endpoints: ["BorderLeaf-2:ethernet-1/1", "Spine-1:ethernet-1/2"]
    - endpoints: ["BorderLeaf-2:ethernet-1/2", "Spine-2:ethernet-1/2"]

    # Spine to Leaf Mesh
    - endpoints: ["Spine-1:ethernet-1/3", "Leaf-1:ethernet-1/1"]
    - endpoints: ["Spine-1:ethernet-1/4", "Leaf-2:ethernet-1/1"]
    - endpoints: ["Spine-2:ethernet-1/3", "Leaf-1:ethernet-1/2"]
    - endpoints: ["Spine-2:ethernet-1/4", "Leaf-2:ethernet-1/2"]